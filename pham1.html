                        id: index, timeFormatted: `${match[1]}:${match[2]}:${match[3]}`,
                        seconds: parseInt(match[1])*3600 + parseInt(match[2])*60 + parseInt(match[3]),
                        cn: match[4].trim(), pinyin: match[5].trim(), vietHan: match[6].trim(), en: match[7].trim(), vietTrans: match[8].trim(),
                        searchText: (match[4]+match[5]+match[6]+match[7]+match[8]).toLowerCase()
                    };
                }
                return null;
            }).filter(i => i !== null);
        }

        function analyzeVocabulary(items) {
            const allChars = new Set();
            items.forEach(item => { const chars = item.cn.match(/[\u4e00-\u9fa5]/g); if(chars) chars.forEach(c => allChars.add(c)); });
            let inCount = 0, outCount = 0;
            allChars.forEach(c => tamThienTuSet.has(c) ? inCount++ : outCount++);
            const total = allChars.size;
            document.getElementById('uniqueCharCount').textContent = total;
            document.getElementById('inTTTCount').textContent = inCount;
            document.getElementById('inTTTPerc').textContent = total ? Math.round((inCount/total)*100) + '%' : '0%';
            document.getElementById('outTTTCount').textContent = outCount;
            document.getElementById('outTTTPerc').textContent = total ? Math.round((outCount/total)*100) + '%' : '0%';
            
            const ctx = document.getElementById('vocabChart').getContext('2d');
            if(vocabChartInstance) vocabChartInstance.destroy();
            vocabChartInstance = new Chart(ctx, {
                type: 'doughnut',
                data: { labels: ['Trong Tam Thiên Tự', 'Ngoài danh sách'], datasets: [{ data: [inCount, outCount], backgroundColor: ['#22c55e', '#f59e0b'], borderWidth: 0 }] },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { color: '#e7e5e4' } } }, cutout: '70%' }
            });
        }

        function renderList(items) {
            const container = document.getElementById('transcriptContainer');
            container.innerHTML = '';
            items.forEach(item => {
                const div = document.createElement('div');
                div.id = `line-${item.id}`;
                div.className = 'transcript-item p-4 rounded-lg cursor-pointer mb-2';
                div.onclick = () => jumpToTime(item.seconds);
                let processedCn = item.cn;
                if (analysisMode) {
                    processedCn = item.cn.split('').map(char => /[\u4e00-\u9fa5]/.test(char) ? (tamThienTuSet.has(char) ? `<span class="char-basic">${char}</span>` : `<span class="char-advanced">${char}</span>`) : char).join('');
                }
                div.innerHTML = `
                    <div class="flex gap-4 items-start relative pr-8">
                        <span class="text-xs font-mono text-amber-500 bg-amber-900/30 px-2 py-1 rounded h-fit shrink-0 mt-2">${item.timeFormatted}</span>
                        <div class="flex-1 space-y-1">
                            <div class="cn-text">${processedCn}</div>
                            <div class="pinyin-text">${item.pinyin}</div>
                            <div class="viet-han-text">${item.vietHan}</div>
                            <div class="viet-trans-text">${item.vietTrans}</div>
                            <div class="en-text">${item.en}</div>
                        </div>
                        <button onclick="event.stopPropagation(); speakText('${item.cn.replace(/'/g, "\\'")}')" class="absolute right-0 top-2 text-stone-600 hover:text-amber-500 p-2 rounded-full hover:bg-stone-700/50 audio-btn">🔊</button>
                    </div>`;
                container.appendChild(div);
            });
            document.getElementById('visibleCount').textContent = `${items.length} câu`;
        }

        function jumpToTime(s) { currentSimulationTime = s; updateTimeDisplay(s); highlightCurrentLine(); }
        function updateTimeDisplay(s) { const h=Math.floor(s/3600), m=Math.floor((s%3600)/60), sec=s%60; document.getElementById('currentTimeDisplay').textContent = `${h>0?h+':':''}${m<10?'0'+m:m}:${sec<10?'0'+sec:sec}`; }
        function highlightCurrentLine() {
            let active = null;
            for(let i=transcripts.length-1; i>=0; i--) { if(transcripts[i].seconds <= currentSimulationTime) { active = transcripts[i]; break; } }
            document.querySelectorAll('.active-line').forEach(el => el.classList.remove('active-line'));
            if(active) {
                const el = document.getElementById(`line-${active.id}`);
                if(el) { 
                    el.classList.add('active-line');
                    // TỰ ĐỘNG LĂN CHUỘT
                    el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    
                    if(isPlaying && document.getElementById('autoRead').checked) speakText(active.cn); 
                }
            }
        }
        function scrollToActive() { const active = document.querySelector('.active-line'); if(active) active.scrollIntoView({ behavior: 'smooth', block: 'center' }); }

        document.addEventListener('DOMContentLoaded', () => {
            transcripts = parseSubtitles(rawSubtitleData);
            analyzeVocabulary(transcripts);
            renderList(transcripts);
            const select = document.getElementById('jumpSelect');
            for(let i=1; i<=Math.ceil(transcripts[transcripts.length-1].seconds/60); i++) {
                const opt = document.createElement('option'); opt.value = i*60; opt.textContent = `${i}:00`; select.appendChild(opt);
            }
            select.addEventListener('change', e => jumpToTime(parseInt(e.target.value)));
            
            document.getElementById('searchInput').addEventListener('input', e => {
                const term = e.target.value.toLowerCase();
                renderList(transcripts.filter(t => t.searchText.includes(term)));
            });

            document.getElementById('btnPlay').addEventListener('click', () => {
                isPlaying = true; document.getElementById('btnPlay').classList.add('hidden'); document.getElementById('btnPause').classList.remove('hidden');
                simulationInterval = setInterval(() => { currentSimulationTime++; updateTimeDisplay(currentSimulationTime); highlightCurrentLine(); }, 1000);
            });
            document.getElementById('btnPause').addEventListener('click', () => {
                isPlaying = false; clearInterval(simulationInterval); window.speechSynthesis.cancel();
                document.getElementById('btnPlay').classList.remove('hidden'); document.getElementById('btnPause').classList.add('hidden');
            });
            document.getElementById('btnReset').addEventListener('click', () => { if(isPlaying) document.getElementById('btnPause').click(); jumpToTime(0); });
            
            document.getElementById('tttToggle').addEventListener('click', (e) => {
                analysisMode = !analysisMode;
                e.target.classList.toggle('bg-green-900'); e.target.classList.toggle('text-white');
                renderList(transcripts); highlightCurrentLine();
            });
        });
    </script>
</body>
</html>
